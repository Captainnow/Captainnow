name: Update Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at 00:00 UTC — contribution data only changes when you push, so 6-hourly runs were wasted quota
  workflow_dispatch: {}    # adds a "Run workflow" button in the Actions tab for on-demand refreshes
  push:
    branches:
      - main               # refresh right after you edit the README or push new commits elsewhere

permissions:
  contents: write

jobs:
  update-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make sure the assets folder exists
        run: mkdir -p assets

      - name: Install dependencies
        run: |
          sudo apt-get update
          # install jq and docker; if docker package isn't available on the runner this will still attempt jq which lowlighter/metrics needs
          sudo apt-get install -y jq docker.io || true
          # try starting docker in case the action expects the daemon
          sudo systemctl start docker || true
          echo "Checked/installed docker & jq"

      - name: Check METRICS_TOKEN
        run: |
          if [ -z "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "::error::METRICS_TOKEN repository secret is not set. Create a PAT and add it as METRICS_TOKEN in repository secrets. See the workflow logs for more info."
            exit 1
          else
            echo "METRICS_TOKEN found."
          fi

      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=FF6B35&icon_color=FFD23F&text_color=FFD9B3
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D1117&title_color=FF6B35&text_color=FFD9B3
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: gruvbox
          OUTPUT_PATH: assets/streak.svg
          BACKGROUND: "0D1117"
          RING: "FF6B35"
          FIRE: "FFD23F"
          STROKE: "7C2D12"
          CURR_STREAK_LABEL: "FF6B35"

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile visuals"
          git push
