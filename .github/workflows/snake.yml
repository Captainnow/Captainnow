name: generate animated contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Captainnow
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch
          
      - name: Copy generated files to output branch
        run: |
          mkdir -p output-branch/
          cp -r dist/* output-branch/ 2>/dev/null || true
          
      - name: Commit and push to output branch
        working-directory: output-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update contribution snake animation" || echo "No changes to commit"
          git push origin output
